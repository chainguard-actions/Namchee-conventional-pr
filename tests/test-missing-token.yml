name: Test missing access token fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without access_token
        id: action
        continue-on-error: true
        # The action reads INPUT_ACCESS_TOKEN; if empty it returns ErrMissingToken
        # and calls log.Fatalln (exit 1). We expect this step to fail.
        uses: .
        with:
          access_token: ""

      - name: Assert action failed due to missing token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with missing token, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when access_token is missing"
