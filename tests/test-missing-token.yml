name: Test missing access token causes error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action requires access_token. Passing an empty string should
      # cause the action to exit with a fatal "missing token" error.
      # Note: GitHub Actions does not allow truly omitting a required input
      # at runtime, so we pass an empty string to simulate missing token.
      - name: Run action with empty access_token
        id: action
        uses: .
        with:
          access_token: ""
          draft: "true"
          bot: "true"
          strict: "false"
          issue: "false"
          body: "false"
          close: "false"
          verbose: "false"
        continue-on-error: true

      - name: Assert action failed due to missing token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for missing access_token, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for missing access_token"
