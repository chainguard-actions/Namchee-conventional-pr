name: Test invalid title pattern causes config error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # An invalid regex for title_pattern should cause the action to exit non-zero
      # with "[Config] Invalid pull request title pattern" before any API calls.
      - id: action
        uses: .
        with:
          access_token: ${{ github.token }}
          title_pattern: "[invalid-regex("
        continue-on-error: true

      - name: Assert action failed due to invalid title pattern
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid title_pattern, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid title_pattern"
