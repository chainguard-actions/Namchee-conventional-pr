name: Test invalid title pattern causes config error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action validates regex patterns during config initialization.
      # An invalid regex for title_pattern should cause the action to exit
      # with a fatal error before even reading the event.
      - name: Run action with invalid title_pattern regex
        id: action
        uses: .
        with:
          access_token: ${{ github.token }}
          title_pattern: "[invalid-regex("
          draft: "true"
          bot: "true"
          strict: "false"
          issue: "false"
          body: "false"
          close: "false"
          verbose: "false"
        continue-on-error: true

      - name: Assert action failed due to invalid regex
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for invalid title_pattern regex, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid title_pattern regex"
