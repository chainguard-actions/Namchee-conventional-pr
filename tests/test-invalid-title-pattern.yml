name: Test invalid title pattern error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid title_pattern (expect failure)
        id: action
        uses: .
        with:
          access_token: ${{ github.token }}
          # An invalid regex pattern (unclosed bracket) should cause ReadConfig to fail
          title_pattern: "[invalid-regex("
          issue: "false"
          body: "false"
        continue-on-error: true

      - name: Assert action failed due to invalid title pattern
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid title_pattern, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid title_pattern"
