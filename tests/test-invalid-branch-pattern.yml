name: Test invalid branch pattern fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid regex branch_pattern
        id: action
        continue-on-error: true
        # The action compiles branch_pattern as a regex; an invalid pattern
        # causes ReadConfig to return ErrInvalidBranchPattern and the action
        # calls log.Fatalln (exit 1). We expect this step to fail.
        uses: .
        with:
          access_token: ${{ github.token }}
          branch_pattern: "[invalid(regex"

      - name: Assert action failed due to invalid branch pattern
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid branch_pattern, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when branch_pattern is an invalid regex"
