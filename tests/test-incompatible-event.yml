name: Test incompatible event (non-PR trigger)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action reads GITHUB_EVENT_PATH to determine the PR sub-event.
      # Under workflow_dispatch, the event JSON has no "action" field matching
      # PR sub-events (opened/reopened/etc.), so the action should exit 0
      # with "Incompatible sub-events detected. Exiting..."
      - name: Run action with workflow_dispatch event
        id: action
        uses: .
        with:
          access_token: ${{ github.token }}
          draft: "true"
          bot: "true"
          strict: "false"
          issue: "false"
          body: "false"
          close: "false"
          verbose: "false"
        continue-on-error: true

      - name: Assert action exited successfully for incompatible event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed (exit 0) for incompatible event, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action exited 0 for incompatible event as expected"
